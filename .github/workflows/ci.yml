name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build (server + dashboard + extension)
        run: pnpm run build

      - name: Smoke-test the built server
        run: |
          set -e
          export MAILTRACK_TOKEN=ci-token
          export BASE_URL=http://127.0.0.1:8787
          export HOST=127.0.0.1
          export DB_PATH="$(mktemp -d)/ci.db"
          node dist/server/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/healthz
          curl -sf -o /dev/null -w 'pixel %{http_code}\n' http://127.0.0.1:8787/px/none.gif

      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension/dist
          if-no-files-found: error

  deploy:
    name: Deploy to AWS
    needs: verify
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      REMOTE: ${{ secrets.DEPLOY_SSH_USER || 'ubuntu' }}@${{ secrets.DEPLOY_SSH_HOST }}
      REMOTE_PATH: ${{ secrets.DEPLOY_PATH || 'mail-tracker' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code to the server
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' \
            --exclude='extension/dist' --exclude='data' --exclude='backups' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            ./ "$REMOTE:$REMOTE_PATH/"

      - name: Build & restart the service
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$REMOTE" \
            "cd '$REMOTE_PATH' && sudo SKIP_GIT=1 bash deploy/update.sh"

      - name: Verify the deployment is healthy
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$REMOTE" \
            "curl -sf http://127.0.0.1:8787/healthz"
